<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>My Vehicles</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 0;
      color: #1e293b;
      padding-bottom: 90px;
    }

    /* Top Navigation Bar */
    .top-bar {
      background-color: #0d1b2a;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-bar h1 { font-size: 20px; font-weight: 700; margin: 0; flex-grow: 1; margin-left: 15px; }
    .icon-btn { background: none; border: none; color: white; font-size: 22px; cursor: pointer; position: relative; }
    .badge-count {
      position: absolute;
      top: -2px; right: -4px;
      background: #ef4444;
      color: white;
      font-size: 10px;
      font-weight: bold;
      border-radius: 50%;
      padding: 2px 5px;
    }

    .container { max-width: 500px; margin: 0 auto; padding: 16px; }

    /* Overview Header */
    .overview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .greeting h2 { margin: 0; font-size: 22px; color: #0f172a; }
    .greeting p { margin: 4px 0 0 0; color: #64748b; font-size: 13px; }
    .btn-add {
      background-color: #0d1b2a;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* Vehicle Cards */
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      position: relative;
      border-left: 5px solid #10b981; /* Default Green */
    }
    .card.status-yellow { border-left-color: #f59e0b; }
    .card.status-red { border-left-color: #ef4444; }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .vehicle-info { display: flex; align-items: center; gap: 12px; }
    .vehicle-avatar {
      width: 42px; height: 42px;
      border-radius: 10px;
      background-color: #f1f5f9;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .reg-number { font-size: 17px; font-weight: 800; color: #0f172a; margin: 0; }
    .model-name { font-size: 13px; color: #64748b; margin: 2px 0 0 0; }

    /* Grid of 3 Status Items */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      border-top: 1px solid #f1f5f9;
      padding-top: 12px;
    }
    .metric-item { display: flex; flex-direction: column; align-items: flex-start; }
    .metric-title-row { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
    .icon-circle {
      width: 22px; height: 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
    }
    .metric-label { font-size: 10px; color: #64748b; font-weight: 500; }
    .metric-date { font-size: 12px; font-weight: 700; margin-bottom: 6px; }

    /* Pill Badges */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
    }

    /* Green Theme */
    .theme-green .icon-circle { background-color: #d1fae5; color: #059669; }
    .theme-green .metric-date { color: #059669; }
    .theme-green .pill { background-color: #d1fae5; color: #059669; }

    /* Yellow Theme */
    .theme-yellow .icon-circle { background-color: #fef3c7; color: #d97706; }
    .theme-yellow .metric-date { color: #d97706; }
    .theme-yellow .pill { background-color: #fef3c7; color: #d97706; }

    /* Red Theme */
    .theme-red .icon-circle { background-color: #fee2e2; color: #dc2626; }
    .theme-red .metric-date { color: #dc2626; }
    .theme-red .pill { background-color: #fee2e2; color: #dc2626; }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-around;
      padding: 10px 0 14px;
      z-index: 1000;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 10px;
      color: #64748b;
      background: none;
      border: none;
      cursor: pointer;
    }
    .nav-item.active { color: #0d1b2a; font-weight: 700; }
    .nav-icon { font-size: 20px; margin-bottom: 2px; }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <div class="top-bar">
    <button class="icon-btn">☰</button>
    <h1>My Vehicles</h1>
    <button class="icon-btn">
      🔔<span class="badge-count">2</span>
    </button>
  </div>

  <div class="container">
    <!-- Greeting & Action Header -->
    <div class="overview-header">
      <div class="greeting">
        <h2>Hello! 👋</h2>
        <p>Here’s an overview of your vehicles</p>
      </div>
      <button class="btn-add" onclick="alert('Add vehicle feature coming next!')">
        <span>+</span> Add Vehicle
      </button>
    </div>

    <!-- Vehicle Cards injected here -->
    <div id="vehicleList">
      <p style="text-align: center; color: #64748b; margin-top: 30px;">Loading your dashboard...</p>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <button class="nav-item active">
      <span class="nav-icon">🏠</span>
      Home
    </button>
    <button class="nav-item">
      <span class="nav-icon">🛠️</span>
      Services
    </button>
    <button class="nav-item">
      <span class="nav-icon">📄</span>
      Documents
    </button>
    <button class="nav-item">
      <span class="nav-icon">⏱️</span>
      Reports
    </button>
  </div>

  <script>
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
    const API_URL = "YOUR_WEB_APP_URL_HERE";

    // Helper function to turn timestamp into a clean date (e.g. "12 Aug 2026")
    function formatDate(dateString) {
      if (!dateString) return 'N/A';
      const date = new Date(dateString);
      if (isNaN(date.getTime())) return dateString; // fallback if already text

      const day = String(date.getDate()).padStart(2, '0');
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const month = months[date.getMonth()];
      const year = date.getFullYear();

      return `${day} ${month} ${year}`;
    }

    function getStatusData(dateString) {
      if (!dateString) return { badgeText: "Unknown", colorClass: "theme-green", level: 1 };
      
      const targetDate = new Date(dateString);
      if (isNaN(targetDate.getTime())) return { badgeText: "Invalid", colorClass: "theme-green", level: 1 };

      const today = new Date();
      today.setHours(0,0,0,0);
      const diffDays = Math.ceil((targetDate - today) / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        return { badgeText: "✖ Overdue", colorClass: "theme-red", level: 3 };
      } else if (diffDays <= 14) {
        return { badgeText: "⚠️ Due Soon", colorClass: "theme-yellow", level: 2 };
      } else {
        return { badgeText: "✔ Good", colorClass: "theme-green", level: 1 };
      }
    }

    async function loadDashboard() {
      const listContainer = document.getElementById("vehicleList");
      try {
        const response = await fetch(`${API_URL}?action=getVehicles`);
        const vehicles = await response.json();

        listContainer.innerHTML = "";

        if (!vehicles || vehicles.length === 0) {
          listContainer.innerHTML = "<p style='text-align:center; color:#64748b;'>No vehicles found.</p>";
          return;
        }

        vehicles.forEach(vehicle => {
          const serviceStat = getStatusData(vehicle.NextServiceDate);
          const insuranceStat = getStatusData(vehicle.InsuranceExpiry);
          const pollutionStat = getStatusData(vehicle.PollutionExpiry);

          // Determine card left border color based on worst status
          const worstLevel = Math.max(serviceStat.level, insuranceStat.level, pollutionStat.level);
          let borderClass = "";
          if (worstLevel === 3) borderClass = "status-red";
          else if (worstLevel === 2) borderClass = "status-yellow";

          const card = document.createElement("div");
          card.className = `card ${borderClass}`;
          card.innerHTML = `
            <div class="card-top">
              <div class="vehicle-info">
                <div class="vehicle-avatar">🚗</div>
                <div>
                  <h3 class="reg-number">${vehicle.RegNumber}</h3>
                  <p class="model-name">${vehicle.Name} ${vehicle.Model ? '• ' + vehicle.Model : ''}</p>
                </div>
              </div>
              <div style="color:#94a3b8; font-weight:bold; cursor:pointer;">⋮</div>
            </div>

            <div class="metrics-grid">
              <!-- Next Service -->
              <div class="metric-item ${serviceStat.colorClass}">
                <div class="metric-title-row">
                  <div class="icon-circle">🔧</div>
                  <span class="metric-label">Next Service</span>
                </div>
                <div class="metric-date">${formatDate(vehicle.NextServiceDate)}</div>
                <div class="pill">${serviceStat.badgeText}</div>
              </div>

              <!-- Insurance -->
              <div class="metric-item ${insuranceStat.colorClass}">
                <div class="metric-title-row">
                  <div class="icon-circle">🛡️</div>
                  <span class="metric-label">Insurance Expiry</span>
                </div>
                <div class="metric-date">${formatDate(vehicle.InsuranceExpiry)}</div>
                <div class="pill">${insuranceStat.badgeText}</div>
              </div>

              <!-- Pollution -->
              <div class="metric-item ${pollutionStat.colorClass}">
                <div class="metric-title-row">
                  <div class="icon-circle">🍃</div>
                  <span class="metric-label">Pollution Expiry</span>
                </div>
                <div class="metric-date">${formatDate(vehicle.PollutionExpiry)}</div>
                <div class="pill">${pollutionStat.badgeText}</div>
              </div>
            </div>
          `;
          listContainer.appendChild(card);
        });
      } catch (err) {
        listContainer.innerHTML = `<p style="text-align:center; color:#ef4444;">Failed to load data from Google Sheets.</p>`;
      }
    }

    loadDashboard();
  </script>

</body>
</html>
